name: english-ai-tutor-tests


x-common-env: &common-env
  DEV: true
  PYTHONPATH: /app/src:/app/tests
  ACCESS_TOKEN_EXPIRE_SECONDS: 3600

services:
  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: test-image
      args:
        - DEV=true
    image: backend:test-image
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      <<: *common-env
      OPENAI_API_KEY: dummy-key-for-tests
      SECRET_KEY: test-secret-key
      PGUSER: tutor_user
      DATABRICKS_CLIENT_SECRET: tutor_password # Database password for Databricks environment
      PGDATABASE: tutor_db
      PGHOST: db
      PGPORT: 5432
      SEED_FLASHCARDS: false
    ports:
      - 8900:8900
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4
    ports:
      - "5433:5432"
    environment:
      <<: *common-env
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: tutor_password
      POSTGRES_DB: tutor_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_user -d tutor_db"]
      interval: 5s
      timeout: 5s
      retries: 10
